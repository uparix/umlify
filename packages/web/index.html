<!doctype html>
<html lang="en" data-theme="dark" data-preset="classic">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>umlify</title>
    <script>
      // Resolve theme and preset before first paint (same rules as src/theme/theme.ts).
      (function () {
        var root = document.documentElement;
        var q = new URLSearchParams(location.search);
        var read = function (key) {
          try { return localStorage.getItem(key); } catch (_) { return null; }
        };
        var theme = q.get("theme") || read("umlify-theme");
        if (theme !== "dark" && theme !== "light") {
          theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        var preset = q.get("preset") || read("umlify-preset");
        if (["classic", "signal-flow", "blueprint", "editorial"].indexOf(preset) < 0) preset = "classic";
        root.setAttribute("data-theme", theme);
        root.setAttribute("data-preset", preset);
        if (read("umlify-rail") === "collapsed") root.setAttribute("data-rail", "collapsed");
      })();
    </script>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="8" height="6" rx="1.5" />
            <rect x="13" y="15" width="8" height="6" rx="1.5" />
            <path d="M7 9v5a2 2 0 0 0 2 2h4" />
          </svg>
          <span>umlify</span>
        </div>
        <div class="title-block">
          <h1 id="doc-title">No diagram</h1>
          <nav class="breadcrumbs" id="breadcrumbs" aria-label="Level"></nav>
        </div>
        <span class="live-chip" id="live-chip" data-state="idle" role="status">
          <span class="live-dot" aria-hidden="true"></span>
          <span id="live-label">Not connected</span>
        </span>

        <div class="toolbar" role="toolbar" aria-label="Diagram actions">
          <div class="toolbar-group">
            <button id="btn-theme" type="button" title="Toggle color theme (T)" aria-label="Toggle color theme" aria-keyshortcuts="T">
              <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" /></svg>
              <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
              <span id="theme-label">Dark</span>
            </button>
            <div class="preset-wrap">
              <button id="btn-preset" type="button" title="Visual style (S)" aria-label="Choose visual style" aria-haspopup="menu" aria-expanded="false" aria-controls="preset-menu" aria-keyshortcuts="S">
                <span class="preset-mark" aria-hidden="true"></span>
                <span id="preset-label">Classic</span>
                <svg class="icon chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
              </button>
              <div class="menu" id="preset-menu" role="menu" aria-label="Visual style" hidden></div>
            </div>
          </div>
          <div class="toolbar-group">
            <button id="btn-find" type="button" title="Find a class (⌘K)" aria-label="Find a class" disabled>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
              <span>Find</span>
            </button>
            <button id="btn-zoom-out" type="button" title="Zoom out (−)" aria-label="Zoom out" disabled>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>
            </button>
            <button id="btn-zoom-in" type="button" title="Zoom in (+)" aria-label="Zoom in" disabled>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
            </button>
            <button id="btn-fit" type="button" title="Fit to view (0)" aria-label="Reset diagram view" disabled>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
            </button>
          </div>
          <button id="btn-export" class="primary" type="button" title="Export SVG or PNG (E)" aria-label="Export diagram" disabled>Export</button>
        </div>
      </header>

      <main class="workspace">
        <section class="diagram-container" id="diagram" aria-label="Diagram">
          <div class="empty-state" id="empty-state">
            <h2>No diagram loaded</h2>
            <p>Start umlify with an IR file and it opens here, updating live as the files change:</p>
            <code>umlify path/to/ir.edn</code>
          </div>
          <div class="toast" id="toast" role="alert" hidden>
            <strong>Could not reload</strong>
            <span data-message></span>
            <span class="toast-note">Showing the last version that loaded.</span>
          </div>
          <button class="rail-reveal" id="rail-reveal" type="button" title="Show side panel" aria-label="Show side panel" aria-controls="reader-rail">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
          </button>
        </section>

        <aside class="reader-rail" id="reader-rail" aria-label="Side panel">
          <div class="rail-head">
            <h2>Details</h2>
            <button class="rail-control" id="rail-collapse" type="button" title="Collapse side panel" aria-label="Collapse side panel" aria-controls="reader-rail" aria-expanded="true">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
            </button>
          </div>
          <div class="rail-body">
            <p class="rail-empty">Select a class to see its metrics, members, relationships and source.</p>
          </div>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
